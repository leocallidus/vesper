[package]
name = "vesper"
version = "1.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.8", features = ["v4_14"] }
libadwaita = { version = "0.6", features = ["v1_5"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
gdk4 = "0.8"
gdk4-x11 = "0.8"
gio = "0.19"
glib = "0.19"
glow = "0.13"
libloading = "0.8"
bytemuck = { version = "1.15", features = ["extern_crate_alloc"] }
libc = "0.2"
ksni = "0.3.2"
tokio = { version = "1.48.0", features = ["full"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code", "screensaver"] }
image = "0.25.9"
wayland-client = "0.31"
wayland-protocols = { version = "0.32.9", features = ["staging", "client"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
webkit6 = "0.3.0"
ureq = "2.12.1"
feed-rs = "1.5.3"
